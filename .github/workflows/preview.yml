name: preview

# On every PR to main: build + push a preview image, tag the PR `preview`
# (so the ArgoCD ApplicationSet spins up an env), and comment the URL.
# Image: infra-oci-web-apps-sandbox-green/<repo>/dev:pr-<number>
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # GitHub OIDC -> JFrog
  pull-requests: write # label + comment
  issues: write

env:
  REGISTRY: jfrog.ledgerlabs.net
  IMAGE: infra-oci-web-apps-sandbox-green/clear-signing-erc7730-builder/dev
  # Preview DNS: <repo>-pr-<number>.<wildcard>. Must match argocd/appset-preview.yaml.
  PREVIEW_HOST: clear-signing-erc7730-builder-pr-${{ github.event.pull_request.number }}.aws.sbx.ldg-tech.com

jobs:
  build:
    runs-on: public-ledgerhq-shared-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: SKIP_ENV_VALIDATION=1 npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --target pydeps -r requirements.txt

      - name: JFrog OIDC login
        id: jfrog
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://${{ env.REGISTRY }}
        with:
          oidc-provider-name: github-oidc
          oidc-audience: jfrog-github
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}

      # Tag the PR so the preview ApplicationSet's pullRequest generator picks it up.
      - name: Add preview label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['preview'],
            });

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-env
          message: |
            🚀 **Preview environment**

            **URL:** https://${{ env.PREVIEW_HOST }}
            **Image:** `${{ env.REGISTRY }}/${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}`
            **Commit:** `${{ github.event.pull_request.head.sha }}`

            ArgoCD syncs the env within ~30–60s after this image is pushed.
